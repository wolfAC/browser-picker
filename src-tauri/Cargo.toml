[package]
name = "browser-picker"
version = "0.1.0"
description = "Pick a browser and profile for every link you open"
authors = ["you"]
edition = "2024"

[lib]
name = "browser_picker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
url = "2"
base64 = "0.22"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
icns = "0.3"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
shlex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
